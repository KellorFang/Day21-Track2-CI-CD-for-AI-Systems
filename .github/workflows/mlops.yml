name: MLOps Pipeline

on:
  push:
    branches: [master]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "Accuracy: $ACC"

      - name: Upload model to Cloud Storage
        run: |
          python - <<'EOF'
          from google.cloud import storage
          import os

          bucket_name = "${{ secrets.CLOUD_BUCKET }}"
          client = storage.Client(project="ai-lab-16")
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("models/latest/model.pkl")
          blob.upload_from_filename("models/model.pkl")
          print(f"Model uploaded to gs://{bucket_name}/models/latest/model.pkl")
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          import sys
          acc = float("${{ needs.train.outputs.accuracy }}")
          print(f"Model accuracy: {acc:.4f}")
          if acc < 0.70:
              print(f"FAILED: accuracy {acc:.4f} < 0.70. Huy deploy.")
              sys.exit(1)
          print("PASSED: dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        env:
          SSH_KEY_SECRET: ${{ secrets.VM_SSH_KEY }}
        run: |
          python - <<'EOF'
          import os
          import base64
          import subprocess
          
          key_data = os.environ.get("SSH_KEY_SECRET", "").strip()
          
          if not key_data.startswith("-----BEGIN"):
              try:
                  key_data = base64.b64decode(key_data).decode('utf-8')
              except:
                  pass
                  
          if key_data.startswith("-----BEGIN") and key_data.count("\n") < 2:
              key_data = key_data.replace("-----BEGIN OPENSSH PRIVATE KEY-----", "-----BEGIN_KEY-----")
              key_data = key_data.replace("-----END OPENSSH PRIVATE KEY-----", "-----END_KEY-----")
              key_data = key_data.replace(" ", "\n")
              key_data = key_data.replace("-----BEGIN_KEY-----", "-----BEGIN OPENSSH PRIVATE KEY-----\n")
              key_data = key_data.replace("-----END_KEY-----", "\n-----END OPENSSH PRIVATE KEY-----\n")
              while "\n\n" in key_data:
                  key_data = key_data.replace("\n\n", "\n")
                  
          os.makedirs(os.path.expanduser("~/.ssh"), exist_ok=True)
          key_path = os.path.expanduser("~/.ssh/deploy_key")
          with open(key_path, "w") as f:
              f.write(key_data)
          os.chmod(key_path, 0o600)
          EOF
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sudo systemctl restart mlops-serve && sleep 5 && curl -sf http://localhost:8000/health && echo 'Health check passed.' || exit 1"
